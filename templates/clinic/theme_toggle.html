<form class="theme-form" method="post" action="{% url 'set_theme' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="theme" value="{% if interface_theme == 'dark' %}light{% else %}dark{% endif %}" data-theme-value><button class="theme-toggle" type="submit" aria-label="تغییر حالت نمایش"><span class="theme-icon" aria-hidden="true">{% if interface_theme == 'dark' %}☀{% else %}☾{% endif %}</span><span class="theme-label">{% if interface_theme == 'dark' %}حالت روز{% else %}حالت شب{% endif %}</span></button></form>
