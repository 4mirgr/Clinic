{% if page.has_other_pages %}<nav class="pagination" aria-label="صفحه‌بندی">{% if page.has_previous %}<a class="button ghost" href="?q={{ q|urlencode }}&amp;page={{ page.previous_page_number }}">صفحه قبل</a>{% endif %}<span>صفحه {{ page.number }} از {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button ghost" href="?q={{ q|urlencode }}&amp;page={{ page.next_page_number }}">صفحه بعد</a>{% endif %}</nav>{% endif %}
