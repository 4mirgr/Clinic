name: Clinic verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clinic-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clinic_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: clinic_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U clinic_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLINIC_ENV: development
      DJANGO_SECRET_KEY: isolated-ci-test-key-not-a-production-secret-8543189265074138
      DATABASE_URL: postgres://clinic_test:isolated_ci_password@127.0.0.1:5432/clinic_test?sslmode=disable
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      GOOGLE_TOKEN_ENCRYPTION_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Isolated runtime paths
        run: |
          echo "CLINIC_DATA_DIR=$RUNNER_TEMP/clinic-data" >> "$GITHUB_ENV"
          echo "CLINIC_STATIC_ROOT=$RUNNER_TEMP/clinic-static" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Locked requirements and migration drift
        run: |
          python -m pip check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
      - name: Full SQLite suite
        run: python manage.py test --noinput
        env:
          DATABASE_URL: ''
      - name: Full PostgreSQL suite
        run: python manage.py test --noinput
      - name: Browser workflows and proxy boundaries
        run: |
          python scripts/check_browser.py
          node --test deploy/cloudflare/worker.test.mjs
          node --test deploy/preview/worker.test.mjs
          python scripts/check_preview.py
          python scripts/check_education_pdf.py
