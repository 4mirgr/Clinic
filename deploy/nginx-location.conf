# Include INSIDE the existing HTTPS server block for drgerami-md.ir.
# Do not replace the existing location / or website configuration.
# Define in nginx http context if applying login rate limiting:
# limit_req_zone $binary_remote_addr zone=clinic_login:10m rate=10r/m;
# Configure real client IP restoration from trusted Cloudflare ranges before using IP limits.

location = /dash {
    return 302 /dash/;
}

location /dash/ {
    client_max_body_size 21m;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    # If the server inherits proxy_cache, explicitly disable it here.
    proxy_cache off;
    # Avoid logging patient search terms/record identifiers in access logs.
    access_log off;
}

# No public /media/ alias. Private files are only served by authorized Django views.
# Cloudflare: bypass cache for /dash and /dash/*, do not apply "Cache Everything".
# Use Full (strict) TLS. Do not expose the Python origin directly.
